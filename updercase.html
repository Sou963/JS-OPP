<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uppercase</title>
  </head>
  <body>
    <h3>Uppercase</h3>
    <input
      type="text"
      placeholder="small to uppercase"
      id="in"
      oninput="uppercase()"
    />

    <script>
      function uppercase() {
        const element = document.getElementById("in");
        element.value = element.value.toUpperCase();
      }
    </script>
  </body>
</html>
