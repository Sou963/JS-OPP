<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link block</title>
  </head>
  <body>
    <h3>Link block</h3>
    <a id="btn" href="https://artsandculture.google.com/">Click me</a>
    <p id="demo"></p>

    <script>
      const box = document.getElementById("btn");
      //add eventlisner
      box.addEventListener("click", function (event) {
        event.preventDefault();
        document.getElementById("demo").innerHTML = "Link blocked";
      });
    </script>
  </body>
</html>
