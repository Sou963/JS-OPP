<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>short</title>
  </head>
  <body>
    <h3>shortcut</h3>
    <p onclick="shortcut(this)">This is shortcut</p>

      function shortcut(id) {
        id.innerHTML = "This is change";
      }
    </script>
