<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keypress.gm</title>
  </head>
  <body>
    <h3>Press the key! 👆</h3>
    <input type="text" placeholder="press the key" id="in" />
    <p id="demo"></p>

    <script>
      const input = document.getElementById("in");
      //add event listener
      input.addEventListener("keypress", function (event) {
        document.getElementById("demo").innerHTML =
          "You clicked:- " + event.key;
      });
    </script>
  </body>
</html>
